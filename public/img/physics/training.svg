<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 276" width="420" height="276" role="img" aria-label="Illustration: training loss on the same tower-stacking task. Where towers stand, loss falls smoothly and settles low. Where towers fall at scale, loss falls slower, spikes again and again, and ends higher.">
