<g style="--d:0.5s"><g class="up"><use href="#T" x="298" y="316"/></g><use class="dn" href="#R" x="298" y="316"/></g>
<g style="--d:0.3s"><g class="up"><use href="#T" x="326" y="316"/></g><use class="dn" href="#R" x="326" y="316"/></g>
<g style="--d:0.45s"><g class="up"><use href="#T" x="354" y="316"/></g><use class="dn" href="#R" x="354" y="316"/></g>
<g style="--d:0.25s"><g class="up"><use href="#T" x="382" y="316"/></g><use class="dn" href="#R" x="382" y="316"/></g>
</svg>
