<g style="--d:0.15s"><g class="up"><use href="#T" x="242" y="262"/></g><use class="dn" href="#R" x="242" y="262"/></g>
<g style="--d:0.65s"><g class="up"><use href="#T" x="270" y="262"/></g><use class="dn" href="#R" x="270" y="262"/></g>
<g style="--d:0.05s"><g class="up"><use href="#T" x="298" y="262"/></g><use class="dn" href="#R" x="298" y="262"/></g>
<g style="--d:0.6s"><g class="up"><use href="#T" x="326" y="262"/></g><use class="dn" href="#R" x="326" y="262"/></g>
<g style="--d:0.0s"><g class="up"><use href="#T" x="354" y="262"/></g><use class="dn" href="#R" x="354" y="262"/></g>
<g style="--d:0.5s"><g class="up"><use href="#T" x="382" y="262"/></g><use class="dn" href="#R" x="382" y="262"/></g>
<text x="16" y="302" class="l">4,096 copies</text>
<text x="16" y="317" class="s b" style="fill:#2a4f8f">98 % fall</text>
<line x1="122" y1="316.5" x2="408" y2="316.5" stroke="#d8d8d0"/>
<g style="--d:0.75s"><g class="up"><use href="#T" x="130" y="316"/></g><use class="dn" href="#R" x="130" y="316"/></g>
<g style="--d:0.15s"><g class="up"><use href="#T" x="158" y="316"/></g><use class="dn" href="#R" x="158" y="316"/></g>
