<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 344" width="420" height="344" role="img" aria-label="The same tower of cubes copied 1, 16, 256, 1,024 and 4,096 times on one GPU. Alone it stands; the more copies run at once, the more of them fall: 0, 36, 86 and 98 percent.">
<defs><g id="T" fill="#f3f2ed" stroke="#16191a" stroke-width="1.2"><rect y="-7" width="7" height="7"/><rect y="-14" width="7" height="7"/><rect y="-21" width="7" height="7"/><rect y="-28" width="7" height="7"/></g><g id="R" fill="#2a4f8f"><rect x="-4" y="-7" width="7" height="7"/><rect x="5" y="-7" width="7" height="7" transform="rotate(18 8.5 -3.5)"/><rect x="13" y="-7" width="7" height="7" transform="rotate(-12 16.5 -3.5)"/><rect x="1" y="-14" width="7" height="7" transform="rotate(30 4.5 -10.5)"/></g></defs>
<style>.l{font:500 12.5px ui-monospace,Menlo,Consolas,monospace;fill:#16191a}.s{font:12px ui-monospace,Menlo,Consolas,monospace;fill:#6b6f6c}.b{fill:#2a4f8f}.t{font:22px Georgia,"Times New Roman",serif;fill:#16191a}
/* 7 s loop: all stand, then the falling share tips over (staggered), hold */
.up{opacity:0;transform-box:fill-box;transform-origin:100% 100%;animation:up 7s ease-in-out infinite var(--d)}
.dn{animation:dn 7s ease-in-out infinite var(--d)}
@keyframes up{0%,8%{opacity:0;transform:none}12%,46%{opacity:1;transform:none;animation-timing-function:ease-in}54%{opacity:1;transform:rotate(55deg)}58%,100%{opacity:0;transform:rotate(80deg)}}
@keyframes dn{0%,8%{opacity:1}12%,52%{opacity:0}58%,100%{opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect width="420" height="344" fill="#f3f2ed"/>
<text x="16" y="34" class="t">One tower, copied</text>
<text x="16" y="86" class="l">1 copy</text>
<text x="16" y="101" class="s">stands</text>
<line x1="122" y1="100.5" x2="408" y2="100.5" stroke="#d8d8d0"/>
<use href="#T" x="130" y="100"/>
<text x="16" y="140" class="l">16 copies</text>
<text x="16" y="155" class="s">0 % fall</text>
<line x1="122" y1="154.5" x2="408" y2="154.5" stroke="#d8d8d0"/>
<use href="#T" x="130" y="154"/>
<use href="#T" x="158" y="154"/>
<use href="#T" x="186" y="154"/>
<use href="#T" x="214" y="154"/>
<use href="#T" x="242" y="154"/>
<use href="#T" x="270" y="154"/>
<use href="#T" x="298" y="154"/>
<use href="#T" x="326" y="154"/>
<use href="#T" x="354" y="154"/>
<use href="#T" x="382" y="154"/>
<text x="16" y="194" class="l">256 copies</text>
<text x="16" y="209" class="s b" style="fill:#2a4f8f">36 % fall</text>
<line x1="122" y1="208.5" x2="408" y2="208.5" stroke="#d8d8d0"/>
<use href="#T" x="130" y="208"/>
<use href="#T" x="158" y="208"/>
<use href="#T" x="186" y="208"/>
<use href="#T" x="214" y="208"/>
<use href="#T" x="242" y="208"/>
<use href="#T" x="270" y="208"/>
<g style="--d:0.75s"><g class="up"><use href="#T" x="298" y="208"/></g><use class="dn" href="#R" x="298" y="208"/></g>
<g style="--d:0.15s"><g class="up"><use href="#T" x="326" y="208"/></g><use class="dn" href="#R" x="326" y="208"/></g>
<g style="--d:0.65s"><g class="up"><use href="#T" x="354" y="208"/></g><use class="dn" href="#R" x="354" y="208"/></g>
<g style="--d:0.05s"><g class="up"><use href="#T" x="382" y="208"/></g><use class="dn" href="#R" x="382" y="208"/></g>
<text x="16" y="248" class="l">1,024 copies</text>
<text x="16" y="263" class="s b" style="fill:#2a4f8f">86 % fall</text>
<line x1="122" y1="262.5" x2="408" y2="262.5" stroke="#d8d8d0"/>
<use href="#T" x="130" y="262"/>
<g style="--d:0.45s"><g class="up"><use href="#T" x="158" y="262"/></g><use class="dn" href="#R" x="158" y="262"/></g>
