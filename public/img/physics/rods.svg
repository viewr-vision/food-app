<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 200" width="420" height="200" role="img" aria-label="A stiff beam clamped at one end, bending under its own weight. Stock Newton sags slowly to 40 percent past the exact shape; the fix lands within 1 percent at once.">
<style>.t{font:22px Georgia,"Times New Roman",serif;fill:#16191a}.h{font:17px Georgia,"Times New Roman",serif;fill:#16191a}.l{font:500 12.5px ui-monospace,Menlo,Consolas,monospace;fill:#16191a}.s{font:12px ui-monospace,Menlo,Consolas,monospace;fill:#6b6f6c}.b{font:500 12.5px ui-monospace,Menlo,Consolas,monospace;fill:#2a4f8f}
