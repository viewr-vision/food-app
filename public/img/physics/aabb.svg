<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 400" width="420" height="400" role="img" aria-label="Two worlds with different table widths. World 0's ball should rest on its wider table; world 1's ball should fall past its narrower table. Both worlds race to write their table's bounding box into one shared slot, and the last write, world 1's narrow box, wins. World 0 then checks its ball against the narrow box, skips the contact, and the ball falls through its table.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#16191a"/></marker>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2a4f8f"/></marker>
  </defs>
  <style>
    .t { font: 22px Georgia, "Times New Roman", serif; fill: #16191a; }
    .h { font: 17px Georgia, "Times New Roman", serif; fill: #16191a; }
    .l { font: 500 12.5px ui-monospace, Menlo, Consolas, monospace; fill: #16191a; }
    .s { font: 12px ui-monospace, Menlo, Consolas, monospace; fill: #6b6f6c; }
    .b { font: 500 12.5px ui-monospace, Menlo, Consolas, monospace; fill: #2a4f8f; }
    /* 7 s loop: both worlds send their box to the one slot, world 1's lands last and stays;
       world 0 is then checked against that narrow box and its ball drops through the table */
    .m { transform-box: fill-box; transform-origin: 50% 50%; animation: 7s ease-in-out infinite; }
    .w0 { opacity: 0; animation-name: w0; } .w1 { opacity: 0; animation-name: w1; }
    .nb { animation-name: nb; } .drop { animation-name: drop; }
    @keyframes w0 { 0%,15% { opacity: 0; transform: none; } 17% { opacity: 1; transform: none; } 26% { opacity: 1; transform: translate(24.5px,19.5px); } 31%,100% { opacity: 0; transform: translate(24.5px,19.5px); } }
    @keyframes w1 { 0%,19% { opacity: 0; transform: none; } 21% { opacity: 1; transform: none; } 30%,35% { opacity: 1; transform: translate(-24.5px,19.5px); } 39%,100% { opacity: 0; transform: translate(-24.5px,19.5px); } }
    @keyframes nb { 0%,10% { opacity: 1; } 13%,35% { opacity: 0; } 39%,100% { opacity: 1; } }
    @keyframes drop {
      0%,46% { opacity: 1; transform: none; animation-timing-function: ease-in; }
      53% { opacity: 1; transform: translateY(40px); animation-timing-function: linear; }
      56% { opacity: 0; transform: translateY(46px); }
      66% { opacity: 0; transform: none; }
      72%,100% { opacity: 1; transform: none; }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <rect width="420" height="400" fill="#f3f2ed"/>
  <text x="16" y="34" class="t">Two worlds, one bounding box</text>

  <!-- what should happen -->
  <text x="16" y="66" class="h">Should happen</text>
  <!-- world 0: wide table, ball rests -->
  <text x="16" y="88" class="s">world 0, wide table</text>
  <rect x="24" y="118" width="164" height="12" fill="#e6e5de" stroke="#16191a" stroke-width="1.5"/>
  <circle cx="176" cy="111" r="7" fill="#16191a"/>
  <text x="16" y="152" class="l">ball rests</text>
  <!-- world 1: narrow table, ball falls -->
  <text x="224" y="88" class="s">world 1, narrower table</text>
  <rect x="232" y="118" width="146" height="12" fill="#e6e5de" stroke="#16191a" stroke-width="1.5"/>
  <circle cx="384" cy="111" r="7" fill="#16191a"/>
  <line x1="384" y1="122" x2="384" y2="146" stroke="#16191a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="224" y="152" class="l">ball misses, falls</text>

  <!-- shared slot -->
  <rect x="140" y="182" width="140" height="40" fill="none" stroke="#2a4f8f" stroke-width="1.5"/>
  <text x="210" y="200" text-anchor="middle" class="b">one shared slot</text>
  <text x="210" y="215" text-anchor="middle" class="s">last write wins</text>
  <line x1="100" y1="164" x2="138" y2="194" stroke="#6b6f6c" stroke-width="1.2" marker-end="url(#a)"/>
  <line x1="320" y1="164" x2="282" y2="194" stroke="#6b6f6c" stroke-width="1.2" marker-end="url(#a)"/>
  <text x="28" y="178" class="s">writes box</text>
  <text x="318" y="178" class="s">writes box</text>
  <!-- each world's write, travelling along its arrow -->
  <rect class="m w0" x="104.5" y="168.5" width="10" height="6" fill="#f3f2ed" stroke="#16191a" stroke-width="1.5"/>
  <rect class="m w1" x="306" y="168.5" width="9" height="6" fill="#2a4f8f"/>

  <!-- what happened -->
  <text x="16" y="262" class="h">Happened</text>
  <text x="16" y="284" class="s">world 0, checked</text>
  <text x="16" y="299" class="s">against world 1's box</text>
  <circle class="m drop" cx="176" cy="306" r="7" fill="#2a4f8f"/>
  <rect x="24" y="320" width="164" height="12" fill="#e6e5de" stroke="#16191a" stroke-width="1.5"/>
  <rect class="m nb" x="24" y="314" width="146" height="24" fill="none" stroke="#2a4f8f" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="176" y1="316" x2="176" y2="356" stroke="#2a4f8f" stroke-width="1.5" marker-end="url(#ab)"/>
  <text x="16" y="374" class="b">contact skipped:</text>
  <text x="16" y="390" class="b">falls through its table</text>

  <text x="224" y="284" class="s">world 1</text>
  <rect x="232" y="320" width="146" height="12" fill="#e6e5de" stroke="#16191a" stroke-width="1.5"/>
  <circle cx="384" cy="306" r="7" fill="#16191a"/>
  <line x1="384" y1="316" x2="384" y2="340" stroke="#16191a" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="224" y="374" class="l">falls, as it should</text>
</svg>
